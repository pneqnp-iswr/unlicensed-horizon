name: Publish Horizon QuickPlay v1.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quickplay-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out reviewed main branch
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Test and vet companion launcher
        working-directory: tools/unlicensed-horizon-client
        run: |
          go test -count=1 ./...
          go vet ./...

      - name: Cross-compile embedded CLI
        working-directory: tools/unlicensed-horizon-client
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w" -o ../horizon-quickplay/assets/unlicensed-horizon-client.exe ./cmd/uhc

      - name: Verify QuickPlay PowerShell regressions
        working-directory: tools/horizon-quickplay
        run: python3 verify_static.py

      - name: Compile Windows QuickPlay EXE
        working-directory: tools/horizon-quickplay
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go vet ./...
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -H windowsgui" -o dist/Horizon-QuickPlay-v1.4.exe .

      - name: Validate Windows PE and generate SHA-256 digest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/horizon-quickplay/dist/Horizon-QuickPlay-v1.4.exe')
          b = p.read_bytes()
          assert b[:2] == b'MZ', 'missing DOS header'
          pe = int.from_bytes(b[0x3c:0x40], 'little')
          assert b[pe:pe+4] == bytes([80, 69, 0, 0]), 'missing PE header'
          assert b[pe+4:pe+6] == bytes([0x64, 0x86]), 'not an AMD64 executable'
          print(f'Validated Windows x64 PE: {p.stat().st_size} bytes')
          PY
          cd tools/horizon-quickplay/dist
          sha256sum Horizon-QuickPlay-v1.4.exe > SHA256SUMS.txt

      - name: Publish tested QuickPlay v1.4 to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=quickplay-v1.4
          EXE=tools/horizon-quickplay/dist/Horizon-QuickPlay-v1.4.exe
          SUMS=tools/horizon-quickplay/dist/SHA256SUMS.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; leaving it untouched."
            gh release view "$TAG" --json url
            exit 0
          fi
          cat > /tmp/release-notes.md <<'NOTES'
          ## Horizon QuickPlay v1.4 — Windows x64

          Double-click **Horizon-QuickPlay-v1.4.exe**, enter a local nickname (default: `azetech_`) and press Play.

          - Automatic download of the open-source Horizon engine with release integrity checks
          - Preparation wizard for locally installed, legally obtained Minecraft Java Edition 26.3 game data
          - Optional private offline-mode server connection
          - Fixed PowerShell `HOME` collision and preferences `Replace` exception
          - Diagnostic logs and SHA-256 checksum

          **Build verification:** Go unit tests, `go vet`, PowerShell static regression contracts, Windows x64 cross-build and PE header checks passed in the release job. This does not establish a live Windows GUI/gameplay/multiplayer test.

          **Requirements:** Windows 10/11 x64, internet for engine download, authorized Minecraft Java Edition game resources. This tool does not contain Minecraft proprietary data or bypass online-mode server authentication. It is not affiliated with Mojang/Microsoft or official Horizon.
          NOTES
          gh release create "$TAG" "$EXE" "$SUMS" \
            --target "$GITHUB_SHA" \
            --title "Horizon QuickPlay v1.4 (Windows x64)" \
            --notes-file /tmp/release-notes.md \
            --latest=false
          gh release view "$TAG" --json url
